<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Quality cement and steel products at Soni Steel, Mangrol."><title>Soni Steel | Cement &amp; Steel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--deep:#0f4c5c;--mist:#f2f7f7;--ink:#1b2b30;--muted:#5b6f75;--line:#d5e2e4;--amber:#f2a541;--head:'Bricolage Grotesque','DM Sans',system-ui,sans-serif}*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:72px}body{font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);background:var(--mist);line-height:1.6}h1,h2,h3{font-family:var(--head);line-height:1.15}a{color:inherit}:focus-visible{outline:3px solid var(--amber);outline-offset:2px}.wrap{max-width:1100px;margin:0 auto;padding:0 20px}.top{position:sticky;top:0;z-index:10;background:var(--deep);color:#fff}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px 24px;min-height:64px;flex-wrap:wrap;padding:8px 20px}.logo{font-family:var(--head);font-weight:800;font-size:1.3rem;text-decoration:none}.nav{display:flex;gap:22px}.nav a{text-decoration:none;font-weight:500}.btn{display:inline-block;padding:11px 22px;border-radius:999px;border:2px solid transparent;font:inherit;font-weight:700;text-decoration:none;cursor:pointer;text-align:center}.btn-amber{background:var(--amber);color:#2a1a00}.btn-line{border-color:#7fb0b9;color:#fff}.btn-deep{background:var(--deep);color:#fff}.hero{background:var(--deep);color:#fff;padding:56px 0 72px}.hero .wrap{display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:center}.hero h1{font-size:clamp(2.2rem,5vw,3.6rem)}.hero p{margin:16px 0 28px;max-width:46ch;color:#d3e6e9}.actions{display:flex;flex-wrap:wrap;gap:12px}.sign{background:#fff;color:var(--ink);border-radius:16px;padding:24px}.sign h2{font-size:1.2rem;margin-bottom:14px}.info{display:grid;gap:12px}.info dt{font-size:.85rem;color:var(--muted)}.info dd{font-weight:500;overflow-wrap:anywhere}.info a{text-decoration:none;border-bottom:1px solid var(--line)}.block{padding:56px 0}.block h2{font-size:clamp(1.6rem,3vw,2.1rem);margin-bottom:6px}.sub{color:var(--muted);max-width:60ch}.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0 28px}.chip{padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font:inherit;font-weight:500;cursor:pointer}.chip[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff}.search{margin-left:auto;padding:9px 14px;border:1.5px solid var(--line);border-radius:999px;font:inherit;min-width:220px;background:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}.card img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;padding:8px;background:#fff}.card .body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.card h3{font-size:1.15rem;text-transform:capitalize}.desc{color:var(--muted);font-size:.92rem}.price{font-family:var(--head);font-weight:800;font-size:1.35rem;color:var(--deep)}.price small{font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:500;color:var(--muted)}.badge{padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:700;background:#e6e8e8;color:#3d4b4f}.badge[data-q="premium"]{background:#ffe7bd;color:#6b4300}.badge[data-q="standard"]{background:#d6ecef;color:#0a4350}.card .btn{margin-top:auto}.empty{grid-column:1/-1;color:var(--muted)}.contact{background:#fff;border-top:1px solid var(--line)}.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:24px}iframe{width:100%;height:260px;border:0;border-radius:12px;margin-top:18px;background:var(--mist)}form{display:grid;gap:14px;align-content:start}label{display:block;font-weight:700;margin-bottom:4px}input,textarea{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:var(--mist)}textarea{min-height:140px;resize:vertical}.note{font-size:.85rem;color:var(--muted)}footer{background:var(--deep);color:#cfe3e6;padding:22px 0;font-size:.92rem}@media(max-width:800px){.hero .wrap,.contact-grid{grid-template-columns:1fr}.search{margin-left:0;width:100%}.nav{gap:16px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap bar"><a class="logo" href="#top" id="logo">Soni Steel</a><nav class="nav" aria-label="Main navigation"><a href="#products">Products</a><a href="#contact">Contact</a></nav></div></header>
<main id="top"><section class="hero"><div class="wrap"><div><h1 id="tagline"></h1><p id="about"></p><div class="actions"><a class="btn btn-amber" id="callBtn" href="#">Call us</a><a class="btn btn-line" id="mailBtn" href="#">Email us</a></div></div><aside class="sign" aria-label="Contact details"><h2>Visit or call us</h2><dl class="info" id="heroInfo"></dl></aside></div></section>
<section class="block" id="products"><div class="wrap"><h2>Our products</h2><p class="sub">Browse our cement and steel products. Prices are per unit.</p><div class="tools"><div id="chips" role="group" aria-label="Filter products" style="display:flex;flex-wrap:wrap;gap:10px"></div><input class="search" id="search" type="search" placeholder="Search products" aria-label="Search products"></div><div class="grid" id="grid" aria-live="polite"></div></div></section>
<section class="block contact" id="contact"><div class="wrap"><h2>Get in touch</h2><p class="sub">Send us a message, or call or visit us using the details below.</p><div class="contact-grid"><div><dl class="info" id="contactInfo"></dl><iframe id="map" title="Map showing our location" loading="lazy"></iframe></div><form id="form"><div><label for="fname">Your name</label><input id="fname" required autocomplete="name"></div><div><label for="fmsg">Message</label><textarea id="fmsg" required placeholder="Tell us what you need"></textarea></div><button class="btn btn-deep" type="submit">Send by email</button><p class="note">This opens your email app with the message ready to send.</p></form></div></div></section></main><footer><div class="wrap" id="foot"></div></footer>
<script>
const BUSINESS={name:"Soni Steel",tagline:"Quality products at honest prices",about:"Your trusted source for quality cement and steel in Mangrol. Get in touch for product details and availability.",email:"sachinjagada77@gmail.com",phone:"+91 9824201238",address:"Opp. Court, Secretary Road, Mangrol-362225",hours:"Mon to Sat, 9 am to 8 pm",currency:"₹"};
const PRODUCTS=[
{name:"Wonder Plus",image:"images/product1.png",price:365,unit:"bag",quality:"Premium",description:"Wonder Cement Plus for dependable strength in everyday construction."},
{name:"Wonder Extreme",image:"images/product2.png",price:390,unit:"bag",quality:"Premium",description:"Wonder Cement Extreme for strong, durable construction."},
{name:"Wonder PPC",image:"images/product3.png",price:345,unit:"bag",quality:"Standard",description:"Wonder PPC cement for reliable construction work."},
{name:"Wonder OPC",image:"images/product4.png",price:370,unit:"bag",quality:"Standard",description:"Wonder OPC cement for dependable strength and workability."}
];
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const money=n=>BUSINESS.currency+Number(n).toLocaleString("en-IN");const telHref="tel:"+BUSINESS.phone.replace(/[^\d+]/g,"");const mapsLink="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(BUSINESS.address);
document.title=BUSINESS.name+" | Cement & Steel";$("#logo").textContent=BUSINESS.name;$("#tagline").textContent=BUSINESS.tagline;$("#about").textContent=BUSINESS.about;$("#callBtn").href=telHref;$("#mailBtn").href="mailto:"+BUSINESS.email;$("#foot").textContent="© "+new Date().getFullYear()+" "+BUSINESS.name+". All rights reserved.";$("#map").src="https://www.google.com/maps?q="+encodeURIComponent(BUSINESS.address)+"&output=embed";
const infoHTML=`<div><dt>Phone</dt><dd><a href="${telHref}">${esc(BUSINESS.phone)}</a></dd></div><div><dt>Email</dt><dd><a href="mailto:${esc(BUSINESS.email)}">${esc(BUSINESS.email)}</a></dd></div><div><dt>Location</dt><dd>${esc(BUSINESS.address)} <a href="${mapsLink}" target="_blank" rel="noopener">Open in Maps</a></dd></div><div><dt>Opening hours</dt><dd>${esc(BUSINESS.hours)}</dd></div>`;$("#heroInfo").innerHTML=infoHTML;$("#contactInfo").innerHTML=infoHTML;
let activeQuality="All",searchTerm="";const grid=$("#grid");function render(){const list=PRODUCTS.filter(p=>(activeQuality==="All"||p.quality===activeQuality)&&p.name.toLowerCase().includes(searchTerm));grid.innerHTML=list.length?list.map(p=>`<article class="card"><img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy"><div class="body"><div class="row"><h3>${esc(p.name)}</h3><span class="badge" data-q="${esc(p.quality.toLowerCase())}">${esc(p.quality)}</span></div><p class="desc">${esc(p.description)}</p><div class="row"><span class="price">${money(p.price)} <small>per ${esc(p.unit)}</small></span></div><button class="btn btn-deep ask" data-name="${esc(p.name)}">Ask about this</button></div></article>`).join(""):'<p class="empty">No products match. Try a different search or filter.</p>';grid.querySelectorAll(".ask").forEach(btn=>btn.addEventListener("click",()=>{$("#fmsg").value="Hi, I’m interested in “"+btn.dataset.name+"”. Please share more details.";$("#contact").scrollIntoView();$("#fname").focus({preventScroll:true})}));}
function buildChips(){const qualities=["All",...new Set(PRODUCTS.map(p=>p.quality))],box=$("#chips");box.innerHTML=qualities.map(q=>`<button class="chip" aria-pressed="${q===activeQuality}" data-q="${esc(q)}">${esc(q)}</button>`).join("");box.querySelectorAll(".chip").forEach(chip=>chip.addEventListener("click",()=>{activeQuality=chip.dataset.q;box.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===chip));render()}));}
$("#search").addEventListener("input",e=>{searchTerm=e.target.value.trim().toLowerCase();render()});$("#form").addEventListener("submit",e=>{e.preventDefault();const name=$("#fname").value.trim(),msg=$("#fmsg").value.trim();location.href="mailto:"+BUSINESS.email+"?subject="+encodeURIComponent("Enquiry from "+name)+"&body="+encodeURIComponent(msg+"\n\n"+name)});buildChips();render();
</script></body></html>
